[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "honest-peer"
version = "0.1.0"
description = "Reproducible honest-peer persona fine-tuning and epistemics evaluations"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PyYAML==6.0.2", "numpy==1.26.4", "scipy==1.16.1",
  "matplotlib==3.10.1", "anthropic==0.51.0", "huggingface-hub==0.34.3",
  "datasets==3.6.0", "ijson==3.3.0", "filelock==3.18.0",
  "pyarrow==20.0.0", "pandas==2.2.3",
]

[project.optional-dependencies]
data = ["detoxify==0.5.2", "langdetect==1.0.9", "transformers==4.53.2", "torch==2.7.1"]
rewrite = ["transformers==4.53.2"]
train = ["torch==2.7.1", "transformers==4.53.2", "peft==0.16.0", "accelerate==1.8.1", "wandb==0.21.0"]
eval = ["vllm==0.10.0; sys_platform == 'linux'", "torchaudio==2.7.1; sys_platform == 'linux'", "torchvision==0.22.1; sys_platform == 'linux'", "transformers==4.53.2", "lm-eval==0.4.8", "nltk==3.9.1", "langdetect==1.0.9", "immutabledict==4.2.1"]
dev = ["pytest==8.3.5", "ruff==0.11.8"]

[project.scripts]
honest-peer = "honest_peer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/honest_peer"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: downloads a real tokenizer; opt in with RUN_TOKENIZER_TEST=1"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
